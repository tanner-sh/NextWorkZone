[package]
name = "nextworkzone-richdoc"
version.workspace = true
edition.workspace = true

# 富文本的统一文档模型，以及与 HTML、Markdown、Jira wiki 标记、Confluence XHTML 之间的转换。
# 原生界面用文档模型显示和编辑富文本；格式转换都在这里完成，各端共用。

[dependencies]
serde.workspace = true
serde_json.workspace = true
dom_query = "0.28"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
