[package]
name = "nextworkzone-app"
version.workspace = true
edition.workspace = true

# 各平台界面共用的应用层：运行期状态、全部业务命令、后台同步和剪贴板记录。
# 不依赖任何界面框架，窗口、托盘、快捷键、通知等平台能力通过 [`Host`] 交给各端实现。

[dependencies]
nextworkzone-core.workspace = true
nextworkzone-jira.workspace = true
nextworkzone-confluence.workspace = true
nextworkzone-gitlab.workspace = true
nextworkzone-workspace.workspace = true
nextworkzone-clipboard.workspace = true
nextworkzone-desktop.workspace = true
nextworkzone-richdoc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["fs"] }
url.workspace = true
percent-encoding = "2"
