[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
nextworkzone-core = { path = "crates/core" }
nextworkzone-jira = { path = "crates/jira" }
nextworkzone-confluence = { path = "crates/confluence" }
nextworkzone-gitlab = { path = "crates/gitlab" }
nextworkzone-workspace = { path = "crates/workspace" }
nextworkzone-preview = { path = "crates/preview" }
nextworkzone-clipboard = { path = "crates/clipboard" }
nextworkzone-desktop = { path = "crates/desktop" }
nextworkzone-app = { path = "crates/app" }
nextworkzone-richdoc = { path = "crates/richdoc" }

base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
keyring = "4.2"
quick-xml = "0.42"
reqwest = { version = "0.13", features = ["json", "multipart", "query", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"

# 发布版本：整体优化并去掉符号，二进制更小、启动更快（编译会慢一些）。
# 不用 panic = "abort"：命令中的 panic 应当只让这次调用失败，而不是退出整个应用。
[profile.release]
lto = true
codegen-units = 1
strip = true
